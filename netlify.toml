####################################################################
# Netlify configuration for the Archer's Tier List web app.
#
# The repository root IS the project root. Pinning it explicitly keeps
# an invalid project-level base directory from overriding this config.
#
# The Discord gateway in /gateway is a SEPARATE long-running service
# (Railway etc.) and is intentionally not built or deployed here.
####################################################################

[build]
  base = "."
  # `netlify deploy --build` does not install project dependencies, so make
  # the build self-contained before invoking the locally declared Vite CLI.
  command = "npm install --include=dev --no-audit --no-fund && npm run build"
  # Nitro's netlify preset writes static assets to dist/ and the SSR
  # handler to .netlify/functions-internal/ (picked up automatically).
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"
  # Pin the server output to Netlify Functions so SSR + all
  # /api routes and server functions work in production.
  NITRO_PRESET = "netlify"
